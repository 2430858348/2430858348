<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="终端窗口：夏天一，运维工程师，中国苏州">
  <defs>
    <clipPath id="win">
      <rect x="0" y="0" width="760" height="400" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="760" height="400" fill="#D9B99B"/>
    <rect width="760" height="50" fill="#C7A184"/>
    <path d="M0 50 H760" stroke="#B08D6E" stroke-width="1"/>

    <circle cx="26" cy="25" r="6" fill="#7A4F2E"/>
    <circle cx="48" cy="25" r="6" fill="#8B5E3C"/>
    <circle cx="70" cy="25" r="6" fill="#9C6B47"/>
    <text x="380" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#5C3A21">bash — 夏天一</text>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="19">
      <text x="48" y="106" fill="#4A3020"><tspan fill="#7A4F2E">$</tspan> whoami</text>
      <text x="48" y="148" font-size="30" font-weight="600" fill="#5C3A21">夏天一</text>

      <text x="48" y="194" fill="#4A3020"><tspan fill="#7A4F2E">$</tspan> cat role.txt</text>
      <text x="48" y="232" fill="#3A2618">运维工程师 · 中国苏州（出差中）</text>

      <text x="48" y="278" fill="#4A3020"><tspan fill="#7A4F2E">$</tspan> cat about.md</text>
      <text x="48" y="316" fill="#3A2618">白天管服务器，晚上看星星。</text>

      <text x="48" y="362" fill="#4A3020"><tspan fill="#7A4F2E">$</tspan></text>
      <rect x="70" y="347" width="9" height="20" fill="#7A4F2E">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="759" height="399" rx="14" fill="none" stroke="#B08D6E" stroke-width="1"/>
</svg>
